# Windows CI for personal-agent/ (mirror of personal-agent/.github/workflows/windows-ci.yml with paths prefixed).
# python : lint, environment check, full test suite incl. Windows-only tests + red-team gate, end-to-end selftest
# ui     : TypeScript check, Vite build, Tauri (Rust) build of pa-ui.exe
# bundle : PyInstaller executables + pa-ui.exe -> downloadable "PersonalAgent-windows-bundle" artifact
name: personal-agent-windows

on:
  push:
    paths: ["personal-agent/**", ".github/workflows/personal-agent-windows.yml"]
  pull_request:
    paths: ["personal-agent/**"]
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: personal-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-agent/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze > requirements.lock
      - name: Environment check (native libraries)
        run: python scripts/check_env.py
      - name: Lint
        run: ruff check app tests --select E,F,W,B --ignore E501,B905,B007,B904
      - name: Tests (unit + integration + Windows + red-team N=20)
        env:
          PA_REDTEAM_N: "20"
        run: python -m pytest -q -ra --junitxml=test-results.xml
      - name: End-to-end selftest
        working-directory: personal-agent/app
        run: python -m pa_gateway --selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            personal-agent/test-results.xml
            personal-agent/requirements.lock

  ui:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: personal-agent/app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: personal-agent/app/ui/src-tauri
      - name: Install UI dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build web UI
        run: npm run build
      - name: Build Tauri shell (pa-ui.exe)
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pa-ui
          path: personal-agent/app/ui/src-tauri/target/release/pa-ui.exe

  bundle:
    needs: [python, ui]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: personal-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-agent/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: pa-ui
          path: personal-agent/dist/PersonalAgent
      - name: Build executables (PyInstaller)
        run: |
          pip install -r requirements-dev.txt
          ./scripts/build.ps1 -OutDir dist/PersonalAgent
      - name: Smoke-test the frozen executables
        run: |
          ./dist/PersonalAgent/pa-core.exe --selftest-network; $rc = $LASTEXITCODE
          "pa-core exit: $rc (0 = blocked, 1 = outbound NOT blocked - expected on CI without firewall rules)"
          if ($rc -notin 0, 1) { throw "pa-core.exe did not run correctly ($rc)" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path dist/PersonalAgent/pa-ui.exe)) { throw "pa-ui.exe missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-windows-bundle
          path: personal-agent/dist/PersonalAgent
