# Personal Agent - Windows CI.
# Runs on GitHub-hosted Windows runners: lint, full test suite (incl. Windows-only tests), end-to-end
# selftest, red-team gate, UI type-check/build, Tauri build and a PyInstaller bundle uploaded as an artifact.
# This file is used when personal-agent/ is its own repository. The copy in the parent repository's
# .github/workflows/ runs the same jobs with working-directory personal-agent.
name: personal-agent-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze > requirements.lock
      - name: Environment check (native libraries)
        continue-on-error: true
        run: python scripts/check_env.py
      - name: Lint
        run: ruff check app tests --select E,F,W,B --ignore E501,B905,B007,B904
      - name: Tests (unit + integration + Windows)
        env:
          PA_REDTEAM_N: "20"
        run: python -m pytest -q -ra --junitxml=test-results.xml
      - name: End-to-end selftest
        working-directory: app
        run: python -m pa_gateway --selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            requirements.lock

  ui:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/ui/src-tauri
      - name: Install UI dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build web UI
        run: npm run build
      - name: Build Tauri shell (pa-ui.exe)
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pa-ui
          path: app/ui/src-tauri/target/release/pa-ui.exe

  bundle:
    needs: [python, ui]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pa-ui
          path: dist/PersonalAgent
      - name: Build executables (PyInstaller)
        run: |
          pip install -r requirements-dev.txt
          ./scripts/build.ps1 -OutDir dist/PersonalAgent
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-windows-dev-bundle
          path: dist/PersonalAgent
